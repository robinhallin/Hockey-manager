<!doctype html>
<html lang="sv">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08111f"
  >

  <title>Hockey Manager</title>

  <link rel="stylesheet" href="style.css?v=rink1">
  <link rel="stylesheet" href="coaching.css?v=rink1">
  <link rel="stylesheet" href="attributes.css?v=rink1">
  <link rel="stylesheet" href="career.css?v=rink1">
  <link rel="stylesheet" href="training.css?v=rink1">
  <link rel="stylesheet" href="season.css?v=rink1">
  <link rel="stylesheet" href="recruitment.css?v=rink1">
  <link rel="stylesheet" href="locker.css?v=rink1">
  <link rel="stylesheet" href="medical.css?v=rink1">
  <link rel="stylesheet" href="analysis.css?v=rink1">
  <link rel="stylesheet" href="juniors.css?v=rink1">
  <link rel="stylesheet" href="rink.css?v=rink1">
</head>

<body>

<div class="game-shell">

  <!-- =========================================
       VÄNSTERMENY
  ========================================== -->

  <aside class="sidebar">

    <div class="sidebar-brand">

      <div class="logo">
        HM
      </div>

      <div class="brand-text">
        <strong>HOCKEY</strong>
        <span>MANAGER</span>
      </div>

    </div>


    <div class="club-box">

      <div class="club-badge">
        HV
      </div>

      <div class="club-info">
        <strong>HV71</strong>
        <span>SHL</span>
      </div>

    </div>


    <nav class="manager-nav">
      <button class="nav-item" data-page="medical"><span class="nav-icon">✚</span>Medicinskt team</button>
      <button class="nav-item" data-page="locker"><span class="nav-icon">C</span>Omklädningsrum</button>
      <button class="nav-item" data-page="season"><span class="nav-icon">◇</span>Säsong & historik</button>
      <button class="nav-item" data-page="inbox"><span class="nav-icon">✉</span>Inkorg <span id="inboxCount" class="inbox-count"></span></button>
      <button class="nav-item" data-page="training"><span class="nav-icon">◎</span>Träning</button>

      <div class="nav-section">
        MANAGER
      </div>

      <button
        class="nav-item active"
        data-page="home"
      >
        <span class="nav-icon">⌂</span>
        Översikt
      </button>


      <button
        class="nav-item"
        data-page="squad"
      >
        <span class="nav-icon">♟</span>
        Trupp
      </button>


      <button
        class="nav-item"
        data-page="lines"
      >
        <span class="nav-icon">☷</span>
        Kedjor
      </button>


      <button
        class="nav-item"
        data-page="match"
      >
        <span class="nav-icon">◆</span>
        Match
      </button>


      <button
        class="nav-item"
        data-page="table"
      >
        <span class="nav-icon">▥</span>
        SHL
      </button>


      <div class="nav-section">
        SPORT
      </div>


      <button
        class="nav-item"
        data-page="tactics"
      >
        <span class="nav-icon">◎</span>
        Taktik
      </button>


      <button
        class="nav-item"
        data-page="transfers"
      >
        <span class="nav-icon">⇄</span>
        Rekrytering
      </button>


      <button
        class="nav-item"
        data-page="scouting"
      >
        <span class="nav-icon">⌕</span>
        Scouting
      </button>


      <button class="nav-item" data-page="juniors"><span class="nav-icon">◇</span>Juniorer & talanger</button>

      <button
        class="nav-item"
        data-page="statistics"
      >
        <span class="nav-icon">▥</span>
        Statistik & analys
      </button>


      <div class="nav-section">
        KLUBB
      </div>


      <button
        class="nav-item"
        data-page="finance"
      >
        <span class="nav-icon">kr</span>
        Ekonomi
      </button>


      <button
        class="nav-item"
        data-page="board"
      >
        <span class="nav-icon">▣</span>
        Styrelse
      </button>


      <button
        class="nav-item"
        data-page="news"
      >
        <span class="nav-icon">✉</span>
        Nyheter
      </button>

    </nav>


    <div class="sidebar-bottom">
      <button class="nav-item" onclick="showCareerMenu()"><span class="nav-icon">⌂</span>Huvudmeny</button>

      <button
        class="nav-item settings-item"
        data-page="settings"
      >
        <span class="nav-icon">⚙</span>
        Inställningar
      </button>

      <div class="version">
        Hockey Manager Alpha
      </div>

    </div>

  </aside>


  <!-- =========================================
       HÖGER DEL AV SPELET
  ========================================== -->

  <div class="game-area">


    <!-- TOPPRAD -->

    <header class="topbar">

      <div class="topbar-left">
        <button id="mobileMenu" aria-label="Öppna spelmenyn" aria-expanded="false" onclick="toggleManagerMenu()">Meny</button>

        <div class="current-section">
          ÖVERSIKT
        </div>

      </div>


      <div class="topbar-center">

        <div class="season-info">
          <span>SÄSONG</span>
          <strong>2026/27</strong>
        </div>

      </div>


      <div class="topbar-right">

        <div class="manager-club">
          HV71
        </div>

        <button
          class="continue-button"
          id="continueGame"
        >
          FORTSÄTT
          <span>▶</span>
        </button>

      </div>

    </header>


    <!-- =========================================
         SPELETS SIDINNEHÅLL

         VIKTIGT:
         ID="content" behålls eftersom script.js
         redan använder detta.
    ========================================== -->

    <main
      id="content"
      class="game-content"
    >
    </main>


  </div>

</div>


<script src="season.js?v=rink1"></script>
<script src="training.js?v=rink1"></script>
<script src="career.js?v=rink1"></script>
<script src="attributes.js?v=rink1"></script>
<script src="recruitment.js?v=rink1"></script>
<script src="locker.js?v=rink1"></script>
<script src="medical.js?v=rink1"></script>
<script src="coaching.js?v=rink1"></script>
<script src="analysis.js?v=rink1"></script>
<script src="juniors.js?v=rink1"></script>
<script src="rink.js?v=rink1"></script>
<script src="script.js?v=rink1"></script>

</body>

</html>
