name: Windows beta
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '*.js', '*.css', 'index.html', 'assets/**', '.github/workflows/windows-beta.yml']
permissions:
  contents: read
jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - name: Verify storage, compatibility and protocol boundaries
        run: node --test desktop-beta.test.cjs career-save-integrity.test.cjs career-storage.test.cjs
      - name: Build Windows installer
        run: npm run desktop:windows
      - name: Install and exercise the packaged app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/beta/*Setup.exe)[0].FullName
          $installDirectory = Join-Path $env:RUNNER_TEMP 'HockeyManagerInstalled'
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $env:HM_TEST_EXE = Join-Path $installDirectory 'Hockey Manager.exe'
          if (!(Test-Path $env:HM_TEST_EXE)) { throw 'Installed executable is missing' }
          npm run test:ui --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash installer and include tester guide
        shell: pwsh
        run: |
          Get-FileHash dist/beta/*Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/beta/SHA256SUMS.txt
          Copy-Item BETA_GUIDE.md dist/beta/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-beta-test-results
          path: desktop/test-results/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Hockey-Manager-Windows-Beta-0.1
          path: |
            dist/beta/*Setup.exe
            dist/beta/SHA256SUMS.txt
            dist/beta/BETA_GUIDE.md
          if-no-files-found: error
          retention-days: 30
